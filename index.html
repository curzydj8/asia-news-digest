<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>亚洲新闻速览 · 每日国际媒体亚洲新闻中文版</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --ink: #1a1a1a; --paper: #faf8f3; --accent: #b3261e; --gold: #b98a2f;
    --muted: #8a8578; --card: #ffffff; --line: #e8e2d5;
  }
  body { font-family: "Noto Serif SC", "Songti SC", "STSong", Georgia, serif; background: var(--paper); color: var(--ink); }
  #app { display: flex; min-height: 100vh; }

  /* 顶栏 */
  header { position: fixed; top: 0; left: 280px; right: 0; z-index: 50;
    background: linear-gradient(180deg, #141414, #232323); color: #f5f0e6;
    padding: 14px 28px; display: flex; align-items: center; gap: 14px;
    border-bottom: 3px solid var(--accent); }
  header h1 { font-size: 21px; letter-spacing: 6px; }
  header h1 .dot { color: var(--accent); }
  header p { font-size: 12px; color: #a89f8d; margin-left: auto; text-align: right; line-height: 1.6; }

  /* 左侧日期栏 */
  #sidebar { width: 280px; background: #1c1a17; color: #d8d0bd; position: fixed;
    top: 0; bottom: 0; overflow-y: auto; z-index: 100; }
  #sidebar .brand { padding: 22px 20px 16px; border-bottom: 1px solid #35302a; }
  #sidebar .brand h2 { font-size: 19px; letter-spacing: 5px; color: #f0e6d2; }
  #sidebar .brand small { font-size: 11px; color: #8a8172; display: block; margin-top: 6px; line-height: 1.7; }
  #dates { padding: 10px 0 40px; }
  .date-item { display: block; padding: 13px 20px; cursor: pointer; border-left: 3px solid transparent; text-decoration: none; color: inherit; }
  .date-item:hover { background: #2a261f; }
  .date-item.active { background: #2a261f; border-left-color: var(--accent); }
  .date-item .d { font-size: 16px; font-weight: bold; color: #f0e6d2; letter-spacing: 1px; }
  .date-item .c { font-size: 12px; color: #8a8172; margin-top: 3px; }
  .date-item .w { font-size: 12px; color: var(--gold); margin-left: 8px; }

  /* 主内容 */
  #main { margin-left: 280px; margin-top: 64px; flex: 1; max-width: 1060px; padding: 28px 32px 100px; }
  #day-title { border-bottom: 2px solid var(--ink); padding-bottom: 12px; margin-bottom: 24px;
    display: flex; align-items: baseline; gap: 14px; }
  #day-title h2 { font-size: 26px; letter-spacing: 3px; }
  #day-title span { color: var(--muted); font-size: 14px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    margin-bottom: 22px; overflow: hidden; display: flex; transition: box-shadow .2s; }
  .card:hover { box-shadow: 0 6px 24px rgba(0,0,0,.08); }
  .card .img { width: 300px; min-width: 300px; background: #eee center/cover no-repeat; min-height: 190px; }
  .card .body { padding: 20px 24px; flex: 1; }
  .card .meta { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .src { font-size: 12px; background: var(--ink); color: #fff; padding: 3px 10px; border-radius: 20px; letter-spacing: 1px; }
  .time { font-size: 12px; color: var(--muted); }
  .card h3 { font-size: 19px; line-height: 1.5; margin-bottom: 10px; }
  .card h3 a { color: var(--ink); text-decoration: none; }
  .card h3 a:hover { color: var(--accent); }
  .card .sum { font-size: 14.5px; color: #4a463c; line-height: 1.85; }
  .card .en { font-size: 12.5px; color: var(--muted); margin-top: 10px; line-height: 1.7;
    border-top: 1px dashed var(--line); padding-top: 10px; display: none; }
  .card.show-en .en { display: block; }
  .card .actions { margin-top: 12px; display: flex; gap: 16px; }
  .card .actions a, .card .actions button { font-size: 13px; color: var(--accent); cursor: pointer;
    background: none; border: none; text-decoration: none; font-family: inherit; padding: 0; }
  .card .actions a:hover, .card .actions button:hover { text-decoration: underline; }

  #loading, #empty { text-align: center; padding: 80px 20px; color: var(--muted); font-size: 15px; }
  #menu-btn { display: none; position: fixed; top: 76px; left: 12px; z-index: 200;
    background: #1c1a17; color: #f0e6d2; border: 1px solid var(--gold); border-radius: 8px;
    padding: 8px 12px; font-size: 16px; cursor: pointer; }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 30px; }
  footer a { color: var(--muted); }

  @media (max-width: 860px) {
    #sidebar { transform: translateX(-100%); transition: transform .3s; }
    #sidebar.open { transform: translateX(0); }
    header { left: 0; }
    #main { margin-left: 0; padding: 20px 16px 80px; }
    #menu-btn { display: block; }
    .card { flex-direction: column; }
    .card .img { width: 100%; min-width: 0; min-height: 180px; }
    header p { display: none; }
  }
</style>
</head>
<body>
<button id="menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰ 日期</button>
<div id="app">
  <nav id="sidebar">
    <div class="brand">
      <h2>亚洲新闻速览</h2>
      <small>13 家国际媒体 · 亚洲新闻<br>每日自动抓取 · 译成中文</small>
    </div>
    <div id="dates"><div style="padding:20px;color:#8a8172">加载中…</div></div>
  </nav>
  <div style="flex:1;display:flex;flex-direction:column;min-width:0">
    <header>
      <h1>亚洲新闻速览<span class="dot">·</span></h1>
      <p>CNN / 纽约时报 / 华盛顿邮报 / 华尔街日报 / 福克斯 / NBC / ABC / CBS / NPR / BBC / 卫报 / 金融时报 / 欧洲新闻</p>
    </header>
    <main id="main">
      <div id="day-title" style="display:none"><h2 id="day-h"></h2><span id="day-c"></span></div>
      <div id="list"><div id="loading">正在加载今日新闻…</div></div>
      <footer>新闻内容版权归各原媒体所有，本站仅做聚合翻译供学习交流。<br>图片为原文配图（外链），视频类内容已自动过滤。</footer>
    </main>
  </div>
</div>

<script>
const WEEK = ['日','一','二','三','四','五','六'];
let dates = [];

function fmtDate(dstr) {
  const [y, m, d] = dstr.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  return `${y}年${m}月${d}日 星期${WEEK[dt.getDay()]}`;
}

async function init() {
  try {
    const r = await fetch('data/index.json');
    dates = await r.json();
  } catch (e) {
    document.getElementById('dates').innerHTML = '<div style="padding:20px;color:#8a8172">暂无数据，等待首次抓取…</div>';
    document.getElementById('list').innerHTML = '<div id="empty">新闻正在路上，稍后再来。<br><br>本站每日自动更新。</div>';
    return;
  }
  renderDates();
  const hash = location.hash.replace('#', '');
  const target = dates.some(d => d.date === hash) ? hash : (dates[0] && dates[0].date);
  if (target) loadDay(target);
  window.addEventListener('hashchange', () => {
    const h = location.hash.replace('#', '');
    if (h) loadDay(h);
  });
}

function renderDates() {
  document.getElementById('dates').innerHTML = dates.map(d =>
    `<a class="date-item" data-date="${d.date}" href="#${d.date}">
       <div><span class="d">${d.date.slice(5).replace('-', '月')}日</span><span class="w">${weekday(d.date)}</span></div>
       <div class="c">${d.date} · ${d.count} 条</div>
     </a>`).join('');
}

function weekday(dstr) {
  const [y, m, d] = dstr.split('-').map(Number);
  return '周' + WEEK[new Date(y, m - 1, d).getDay()];
}

function esc(s) {
  return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

async function loadDay(date) {
  document.querySelectorAll('.date-item').forEach(e => e.classList.toggle('active', e.dataset.date === date));
  document.getElementById('sidebar').classList.remove('open');
  const list = document.getElementById('list');
  list.innerHTML = '<div id="loading">正在加载…</div>';
  document.getElementById('day-title').style.display = 'none';
  try {
    const r = await fetch(`data/${date}.json`);
    if (!r.ok) throw 0;
    const arts = await r.json();
    document.getElementById('day-title').style.display = 'flex';
    document.getElementById('day-h').textContent = fmtDate(date);
    document.getElementById('day-c').textContent = `共 ${arts.length} 条`;
    document.title = `${fmtDate(date)} · 亚洲新闻速览`;
    if (!arts.length) {
      list.innerHTML = '<div id="empty">这一天没有抓到亚洲相关新闻。</div>';
      return;
    }
    list.innerHTML = arts.map((a, i) => `
      <article class="card" id="card-${i}">
        ${a.image ? `<div class="img" style="background-image:url('${esc(a.image)}')" onclick="window.open('${esc(a.url)}','_blank')"></div>` : ''}
        <div class="body">
          <div class="meta">
            <span class="src">${esc(a.source_zh)}</span>
            <span class="time">${esc(a.published.slice(0, 16).replace('T', ' '))}</span>
          </div>
          <h3><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.title_zh) || esc(a.title_en)}</a></h3>
          ${a.summary_zh ? `<p class="sum">${esc(a.summary_zh)}</p>` : ''}
          <p class="en"><b>原文标题：</b>${esc(a.title_en)}<br>${esc(a.summary_en)}</p>
          <div class="actions">
            <a href="${esc(a.url)}" target="_blank" rel="noopener">阅读原文 →</a>
            <button onclick="document.getElementById('card-${i}').classList.toggle('show-en')">中/英对照</button>
          </div>
        </div>
      </article>`).join('');
    window.scrollTo(0, 0);
  } catch (e) {
    list.innerHTML = '<div id="empty">加载失败，请稍后重试。</div>';
  }
}

init();
</script>
</body>
</html>
